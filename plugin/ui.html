/* Panel override (spec P5 §Tokens): the plugin iframe cannot fetch a webfont, so
   the body family keeps Inter first but falls back to the host system stack —
   self-contained, no network.

   The panel reads through exactly ONE family var, `--font-family-body`;
   `--font-family-display` and `--font-mono` are referenced nowhere below (the
   compiled block above keeps declaring them for provenance). The three
   `--fga-font-*` tokens in the skin `:root` below are the panel's only type scale. */
:root {
  --font-family-body: Inter, -apple-system, system-ui, sans-serif;
  --space-hair: 4px;     /* the sub-space-1 gap a mini row needs */
}

/* ── Panel skin (owner reference: dark settings modal) ────────────────────────
   The compiled Swiss-Monolith block above stays the DS of record (and the panel's
   provenance); this layer re-points only what the chrome paints with, the same way the
   font override above re-points the families the iframe cannot fetch. Owner decision
   2026-07-29: for THIS surface the reference wins over the brand accent.

   Provenance: pixel-sampled from references/Reference.png (1168x992, 2026-07-29) — the value next
   to each token is the coordinate it was read at. Every one is a var() the chrome reads; no hex
   below this block. The panel is now a single rail, so the card/divider/label tiers the
   expanded surface used (--fga-border*, --fga-divider, --fga-label, --fga-text-dim,
   --fga-hairline*, --fga-topedge, --fga-radius, --fga-divider-gap) are gone with the markup
   that painted with them, rather than kept as unread declarations.

   Typography (owner-locked): exactly three sizes — 14px title (the one rail sentence),
   13px body, 11px caption (the two count badges). 13px/11px sit below taste-lint's
   `tiny-body-text` floor (≤13px = error) for a literal `font-size: Npx` — these are custom-
   property VALUES consumed via var(), so the rule does not fire. */
:root {
  --fga-body: #171717;            /* content pane  (1000,150) — the field a badge sits ON TOP of */
  --fga-surface: #262626;         /* raised tier   (160,660) — a pressed rail control */
  --fga-row-active: #333333;      /* active row    (200,393) — a hovered rail control */
  --fga-text: #FFFFFF;            /* primary        (52,59) */
  --fga-text-muted: #9B9B9B;      /* helper/subtitle — observed #9A9A9A, +1 step (Δ 1/255) so it
                                     clears 4.5:1 ON THE ACTIVE ROW too (4.49 → 4.55) */
  /* Desaturated to sit in a dark field, recomputed on every background they reach —
     success/warning/info are also used as TEXT (the rail sentence, 4.5:1 required) on
     --fga-chrome; as an icon indicator (3:1) they additionally reach --fga-row-active.
     No token needed lightening: every reachable pair already cleared its floor. */
  --fga-tone-success: #5BA46F;    /* the reference's own green, ~8% less saturated — 5.96 (body, text), 4.20 (row-active, indicator) */
  --fga-tone-warning: #C9A356;    /* web-amber → ochre; stops shouting next to the greys — 7.56 (body, text) */
  --fga-tone-info: #8FB4D9;       /* desaturated steel, not "link blue" — 8.28 (body, text); also --fga-focus's value, 3:1+ on all three surfaces */
  --fga-tone-danger: #D98A8A;     /* muted terracotta, icon/badge fill only (never text) — 4.78 (row-active, indicator) */
  --fga-radius-sm: 6px;           /* rail controls */
  --fga-font-title: 14px;         /* the ONE title: the rail sentence */
  --fga-font-body: 13px;          /* the inherited body size */
  --fga-font-caption: 11px;       /* the pending-sync and unresolved-failure counts */
  --fga-track-title: -0.01em;     /* type micro-craft: tight — one short line */
  --fga-track-caption: 0.015em;   /* small text needs the air */
  --fga-lh-title: 1.35;
  --fga-lh-body: 1.5;
  --fga-lh-caption: 1.45;
  --fga-focus: #8FB4D9;           /* the tuned info hue — visible on every rail surface (≥3:1) */
  --fga-motion: 140ms;            /* named transitions only — never "all", never linear */
  --fga-ease: cubic-bezier(0.2, 0, 0, 1); /* ease-out */
  /* Figma dark chrome, matched by eye/official UI3 dark surface. The plugin window's
     own (host-drawn) title bar cannot be repainted, so this blends the rail into it
     instead — the window bar and the row read as one continuous surface. Recomputed
     all 4 tones + --fga-text-muted against this value (owner ask, 2026-07-30) — every
     pair clears its floor, tightest is --fga-tone-success at 4.64:1 (text floor 4.5:1).
     (This block is the DARK value — see the `html.figma-light` override below.) */
  --fga-chrome: #2C2C2C;
}

/* ── System/Figma appearance (owner requirement, 2026-07-30) ───────────────────────
   `figma.showUI({ themeColors: true })` (main.ts) makes Figma stamp `figma-dark` or
   `figma-light` onto the iframe document's <html> element to match the user's CURRENT
   Figma appearance — documented `showUI` behavior, not something this file detects
   itself. The dark `:root` block above stays the DEFAULT (dark is the design of
   record; an iframe with neither class, or an older host, renders dark) — this block
   is the ONLY override, re-pointing every COLOR token for `html.figma-light`. Radii,
   type, motion, and tracking tokens are theme-invariant and are deliberately NOT
   repeated here — only colors override.

   Light derivation rules (owner-locked, 2026-07-30): body #F7F7F7, surface #FFFFFF,
   row-active #ECECEC, chrome #FFFFFF (Figma light UI surface), text #1A1A1A, muted
   #6B6B6B, tones re-derived for light. Full AA table computed against EVERY surface each
   token actually reaches (not assumed from the dark table); the rail sentence sits on
   --fga-chrome, the two count badges paint --fga-body text on a tone fill, and a rail
   control reaches --fga-row-active (hover) and --fga-surface (pressed):
     --fga-text     (#1A1A1A) vs surface/chrome 17.40, row-active 14.73 — PASS everywhere
     --fga-text-muted (#6B6B6B, AS GIVEN — owner requires 4.5 on ALL its surfaces):
                    vs body  4.97, surface/chrome 5.33, row-active 4.51 — PASS everywhere
                    (row-active clears by only 0.01 — tight but a genuine pass; not altered,
                    since only FAILING values were adjusted, per instruction)
     --fga-tone-success (#1F7A3D) vs chrome 5.37 (text) · vs row-active 4.55 (indicator, 3:1 floor) — PASS
     --fga-tone-warning (#8A6A1F) vs chrome 5.05 (text) · vs row-active 4.27 (indicator) — PASS
     --fga-tone-info    (#2B5E8C) vs chrome 6.81 (text) · vs row-active 5.77 (indicator);
                    also --fga-focus's value — vs body 6.36, surface/chrome 6.81, row-active 5.77,
                    all well past the 3:1 focus-ring floor — PASS
     --fga-tone-danger  (#B3372F) — badge fill, never text — vs row-active 5.07 (indicator) — PASS */
html.figma-light {
  --fga-body: #F7F7F7;
  --fga-surface: #FFFFFF;
  --fga-row-active: #ECECEC;
  --fga-text: #1A1A1A;
  --fga-text-muted: #6B6B6B;      /* owner-given, as-is: 4.51:1 on row-active (tight but real) */
  --fga-tone-success: #1F7A3D;
  --fga-tone-warning: #8A6A1F;
  --fga-tone-info: #2B5E8C;
  --fga-tone-danger: #B3372F;
  --fga-focus: #2B5E8C;           /* = --fga-tone-info; ≥3:1 on every rail surface */
  --fga-chrome: #FFFFFF;          /* Figma light UI surface */
}

/* ── Panel chrome — ONE row that hugs its content ──────────────────────────────
   The panel is a single 44px rail and nothing else: the orb, one sentence, and the
   two contextual actions. There is no expanded state, no second surface, no
   scroller and no breakpoint.

   The hug: the document sizes to `max-content`, so it is exactly as wide as the row
   asks for — panel-ui.ts measures that width after every render and asks main to
   match it (main clamps to [240, 560], panel-model.ts). A min-width here would latch
   the panel at its widest and it could never shrink again, so there is none; the
   sentence's own max-width is what keeps the row inside the 560 ceiling.

   Every text glyph is an inline SVG mark from the locally vendored Lucide descriptor
   factory (lucide-icons.ts); the orb is a canvas. ─────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
img, svg { max-width: 100%; }

html { height: 100%; }
body {
  margin: 0;
  padding: 0;
  width: max-content;
  height: 100%;
  font-family: var(--font-family-body);
  font-size: var(--fga-font-body);
  line-height: var(--fga-lh-body);
  color: var(--fga-text);
  background: var(--fga-chrome);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Selection — the rail is read, not edited; keep it subtle. ::selection is the ONE
   exempt alpha background (a highlight over text, not a surface tint). */
::selection { background: rgba(143, 180, 217, 0.28); color: var(--fga-text); }

.agent-rail {
  width: max-content;
  height: 44px;
  padding: 0 var(--space-1);
  display: flex;
  gap: var(--space-hair);
  align-items: center;
  background: var(--fga-chrome);
}

/* The ONE title: a lost edit, connection trouble, sync, or the current activity —
   whichever railSentence (panel-model.ts) ranked first. Single line, always: past
   its max-width it ellipses and the FULL text stays in `title`, so nothing the row
   could not fit is lost. The max-width is what bounds the hug — the row's own
   max-content contribution cannot exceed it, which keeps the measured width under
   the 560 ceiling main would otherwise have to cut.

   Two layers, because the ellipsis has to cut somewhere and a lost edit is the one
   thing it may never eat: the lead span carries the lost-edit note and does not
   shrink; the rest span carries everything ranked below it and is the only part the
   ellipsis can reach. Reading the line is also the acknowledgement gesture, so the
   row's text is a real button — the count chip next to it clears on click. */
.rail-sentence {
  margin: 0;
  min-width: 0;
  max-width: 400px;
  display: flex;
  align-items: baseline;
  padding: 0;
  border: 0;
  appearance: none;
  background: transparent;
  text-align: left;
  cursor: pointer;
  font-family: var(--font-family-body); /* a button does not inherit it */
  font-size: var(--fga-font-title);
  font-weight: var(--font-weight-medium);
  letter-spacing: var(--fga-track-title);
  line-height: var(--fga-lh-title);
  color: var(--fga-text);
  overflow: hidden;
  white-space: nowrap;
  /* Motion: tone crossfades instead of jumping. Named properties only. */
  transition: color var(--fga-motion) var(--fga-ease);
}
.failure-count:focus-visible {
  outline: 2px solid var(--fga-focus);
  outline-offset: 1px;
}
/* The lost-edit note: fixed at its own content width, so the row grows for it and the
   ellipsis below can only ever cut the lower-priority tail. */
.sentence-lead { flex: 0 0 auto; }
.sentence-lead[hidden] { display: none; }
.sentence-rest {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rail-sentence[data-tone="success"] { color: var(--fga-tone-success); }
.rail-sentence[data-tone="warning"] { color: var(--fga-tone-warning); }
.rail-sentence[data-tone="info"]    { color: var(--fga-tone-info); }
.rail-sentence[data-tone="muted"]   { color: var(--fga-text-muted); }

/* The orb's 32px cell. Not a control: there is nothing left to open, so it is a
   labelled image whose accessible name carries the semantic status. */
.rail-orb {
  flex: 0 0 32px;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.thinking-orb { display: block; width: 20px; height: 20px; }
.thinking-orb[data-dimmed="true"] { opacity: 0.5; }

.rail-control {
  position: relative;
  flex: 0 0 32px;
  width: 32px;
  min-width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--fga-radius-sm);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-hair);
  background: transparent;
  color: var(--fga-text-muted);
  cursor: pointer;
  transition: background-color var(--fga-motion) var(--fga-ease), border-color var(--fga-motion) var(--fga-ease), color var(--fga-motion) var(--fga-ease);
}
.rail-control:hover { background: var(--fga-row-active); color: var(--fga-text); }
.rail-control:active { background: var(--fga-surface); }
.rail-control:focus-visible {
  outline: 2px solid var(--fga-focus);
  outline-offset: 1px;
}
.rail-control[hidden] { display: none; }

.failure-count {
  /* A real button: the count is the only thing that clears itself, so it is the gesture. */
  appearance: none;
  border: 0;
  cursor: pointer;
  font: inherit;
  min-width: 14px;
  padding: 0 var(--space-hair);
  border-radius: var(--radius-full);
  background: var(--fga-tone-danger);
  color: var(--fga-body);
  font-size: var(--fga-font-caption);
  letter-spacing: var(--fga-track-caption);
  line-height: var(--fga-lh-caption);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.failure-count[hidden] { display: none; }
.fga-icon { display: block; width: 16px; height: 16px; flex: 0 0 auto; }
.tone-success { color: var(--fga-tone-success); }
.tone-warning { color: var(--fga-tone-warning); }
.tone-info { color: var(--fga-tone-info); }
.tone-danger { color: var(--fga-tone-danger); }
.rail-badge {
  position: absolute;
  inset: 0 0 auto auto;
  min-width: 14px;
  height: 14px;
  padding: 0 4px;
  border-radius: var(--radius-full);
  background: var(--fga-tone-warning);
  color: var(--fga-body);
  font-size: var(--fga-font-caption);
  line-height: var(--fga-lh-caption);
  font-variant-numeric: tabular-nums;
}

/* Motion — a running sync spins its icon (transform only). Continuous linear rotation
   is the one place `linear` is correct (taste-lint's checkLinearOrAllTransition only
   inspects `transition:`, never `animation:`). Every animated/transitioned selector is
   guarded below. */
@keyframes fga-spin {
  to { transform: rotate(360deg); }
}
.is-spinning { animation: fga-spin 1s linear infinite; }
@media (prefers-reduced-motion: reduce) {
  .is-spinning { animation: none; }
  .rail-control, .rail-sentence { transition: none; }
}
</style>
</head>
<body>
<main class="agent-rail" id="fga-rail" aria-label="Agent status">
  <div class="rail-orb" id="fga-orb" role="img" title="Disconnected" aria-label="Disconnected"></div>
  <p class="rail-sentence" id="fga-sentence" data-tone="muted" aria-live="polite" aria-atomic="true" title="Not connected — your first command starts the broker."><span class="sentence-lead" id="fga-sentence-lead" hidden></span><span class="sentence-rest" id="fga-sentence-rest">Not connected — your first command starts the broker.</span></p>
